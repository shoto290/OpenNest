<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Fusion — esquisse × moteur GrokBot</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500&display=swap');
      :root {
        --page: #f1efe8;
        --background: #fffdf7;
        --foreground: #171813;
        --muted-foreground: #6e7067;
        --border: #d5d1c5;
        --primary: #2f66e8;
        --orange: #e36f3d;
        --ink: #26241f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #11130f;
          --background: #1c1f19;
          --foreground: #f3f0e7;
          --muted-foreground: #a5a89d;
          --border: #393d33;
          --primary: #6f96ff;
          --orange: #ff8b5e;
          --ink: #e8e4d8;
        }
      }
      html {
        background: var(--page);
        color-scheme: light dark;
      }
      body {
        margin: 0 auto;
        padding: 36px 24px 80px;
        font-family: 'Azeret Mono', monospace;
        color: var(--foreground);
        max-width: 1080px;
      }
      h1 {
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: 32px;
        margin: 0 0 6px;
      }
      .kicker {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .shell {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 24px;
        align-items: start;
        margin-top: 24px;
      }
      @media (max-width: 820px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }
      .preview {
        position: sticky;
        top: 24px;
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .preview svg {
        width: 100%;
        height: auto;
        touch-action: none;
      }
      .status-line {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .status-line strong {
        color: var(--foreground);
        font-weight: 500;
      }
      .panel {
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .panel h3 {
        margin: 0 0 10px;
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: 17px;
      }
      .seg {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .seg button,
      .action {
        font: inherit;
        font-size: 12px;
        padding: 7px 13px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--foreground);
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        border-color: var(--primary);
        color: var(--primary);
        box-shadow: inset 0 0 0 1px var(--primary);
      }
      .action.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .expression-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
        gap: 6px;
      }
      .expression-grid button {
        font: inherit;
        font-size: 11px;
        padding: 6px 0;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--foreground);
        cursor: pointer;
      }
      .expression-grid button[aria-pressed='true'] {
        border-color: var(--primary);
        color: var(--primary);
      }
      .state-groups {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .state-group span {
        display: block;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        margin-bottom: 6px;
      }
      .control {
        display: block;
        margin-top: 12px;
        font-size: 12px;
      }
      .control-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--primary);
      }
      .switch-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        margin-top: 10px;
      }
      .button-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .outline {
        stroke: var(--stroke-c, var(--ink));
        fill: var(--background);
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line {
        stroke: var(--stroke-c, var(--ink));
        fill: none;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .accent {
        fill: var(--orange);
        stroke: none;
      }
      .eye {
        fill: var(--eye-c, var(--ink));
      }
      .blush {
        transition: opacity 0.5s ease;
      }
      .swatch-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .swatch-row > span {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        width: 84px;
        flex-shrink: 0;
      }
      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--border);
        cursor: pointer;
        padding: 0;
      }
      .swatch[aria-pressed='true'] {
        box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary);
      }
      .spark {
        pointer-events: none;
        fill: var(--background);
      }
      .nav {
        font-size: 12px;
        margin: 6px 0 0;
      }
      .nav a {
        color: var(--primary);
        text-decoration: none;
      }
      .nav span {
        color: var(--muted-foreground);
      }
    </style>
  </head>

              <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
            </filter>
            <clipPath id="face-clip"><path id="clip-path-el" d=""/></clipPath>
          </defs>
          <g filter="url(#sketch)">
            <g id="rig">
              <g id="head-art"></g>
              <g clip-path="url(#face-clip)">
                <g id="face-map">
                  <path class="eye" id="eye-0"/>
                  <path class="eye" id="eye-1"/>
                </g>
              </g>
              <g id="features"></g>
            </g>

        </svg>
        <div class="status-line">
          <span>État <strong id="status-state">waiting</strong></span>
          <span>Expression <strong id="status-expression">00</strong></span>
        </div>
        <div class="button-row">

          <button class="action" id="reset-all" type="button">Réinitialiser</button>
        </div>
      </aside>

        </div>

          <div class="state-groups" id="state-groups"></div>

          <div class="expression-grid" id="expression-grid"></div>
        </div>

          <label class="control">
            <span class="control-head"><span>Rotation</span><output id="turn-output">0°</output></span>
            <input id="turn" type="range" min="-100" max="100" value="0" step="1" />
          </label>
          <label class="control">

          <div class="switch-line">
            <label for="boil">Trait vivant (états actifs seulement)</label>
            <input id="boil" type="checkbox" checked />
          </div>
        </div>
      </main>
    </div>

      const makeUwuExpression = () => {
        const width = 40;
        const depth = 17;
        const thick = 13;
        const cy = 112;
        const makeEye = (cx) => {
          const N = 21;
          const CAP = 3;
          const P = (t) => [cx - width / 2 + width * t, cy + depth * Math.sin(Math.PI * t)];
          const frame = (t) => {
            const d = 0.001;
            const [x1, y1] = P(Math.max(0, t - d));
            const [x2, y2] = P(Math.min(1, t + d));
            const len = Math.hypot(x2 - x1, y2 - y1) || 1;
            return { n: [-(y2 - y1) / len, (x2 - x1) / len], tg: [(x2 - x1) / len, (y2 - y1) / len] };
          };
          const ring = [];
          for (let i = 0; i < N; i++) {
            const t = i / (N - 1);
            const [x, y] = P(t);
            const { n } = frame(t);
            ring.push([x + (n[0] * thick) / 2, y + (n[1] * thick) / 2]);
          }
          const end = frame(1);
          const [ex, ey] = P(1);
          for (let i = 1; i <= CAP; i++) {
            const a = (i / (CAP + 1)) * Math.PI;
            ring.push([
              ex + ((Math.cos(a) * end.n[0] + Math.sin(a) * end.tg[0]) * thick) / 2,
              ey + ((Math.cos(a) * end.n[1] + Math.sin(a) * end.tg[1]) * thick) / 2,
            ]);
          }
          for (let i = 0; i < N; i++) {
            const t = 1 - i / (N - 1);
            const [x, y] = P(t);
            const { n } = frame(t);
            ring.push([x - (n[0] * thick) / 2, y - (n[1] * thick) / 2]);
          }
          const start = frame(0);
          const [sx0, sy0] = P(0);
          for (let i = 1; i <= CAP; i++) {
            const a = (i / (CAP + 1)) * Math.PI;
            ring.push([
              sx0 + ((-Math.cos(a) * start.n[0] - Math.sin(a) * start.tg[0]) * thick) / 2,
              sy0 + ((-Math.cos(a) * start.n[1] - Math.sin(a) * start.tg[1]) * thick) / 2,
            ]);
          }
          return ring;
        };
        return [makeEye(CENTER - 36), makeEye(CENTER + 36)];

        for (const ring of rings) {

        }
        return [x / n, y / n];

        let x = 0, y = 0;
        for (const rings of EXPRESSIONS) {
          const m = meanCentroid(rings);
          x += m[0];
          y += m[1];
        }
        return [x / EXPRESSIONS.length, y / EXPRESSIONS.length];
      })();
      const ringHeight = (ring) => {
        let min = Infinity, max = -Infinity;
        for (const p of ring) {
          min = Math.min(min, p[1]);
          max = Math.max(max, p[1]);
        }
        return max - min;
      };
      const eyesHeight = (rings) => (ringHeight(rings[0]) + ringHeight(rings[1])) / 2;

      const eyesBottom = (rings) => {

      let autoExpressionTimer = null;
      const earPhys = [
        { rot: 0, vRot: 0, sy: 1, vSy: 0 },
        { rot: 0, vRot: 0, sy: 1, vSy: 0 },
      ];
      let earSwap = false;
      let earSwapTimer = null;
      let earTwitchTimer = null;

      function scheduleEarTwitch() {
        clearTimeout(earTwitchTimer);
        const calm = PASSIVE.has(state);
        const delay = (calm ? 5000 : 1600) + Math.random() * (calm ? 9000 : 3000);
        earTwitchTimer = setTimeout(() => {
          const ear = earPhys[Math.floor(Math.random() * earPhys.length)];
          ear.vRot += (Math.random() < 0.5 ? -1 : 1) * (60 + Math.random() * 90);
          scheduleEarTwitch();
        }, delay);
      }
      function scheduleEarSwap() {
        clearTimeout(earSwapTimer);
        earSwapTimer = setTimeout(() => {
          earSwap = !earSwap;
          scheduleEarSwap();
        }, 2200 + Math.random() * 2800);
      }
      let autoBlinkTimer = null;

      const centroid = (ring) => {
        let x = 0, y = 0;
        ring.forEach((p) => { x += p[0]; y += p[1]; });
        return [x / ring.length, y / ring.length];
      };
      const pathFrom = (ring) =>
        'M' + ring.map((p) => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') + 'Z';
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      function displayedRings() {
        return currentRings.map((ring, eye) =>
          ring.map((p, i) => [
            p[0] + (targetRings[eye][i][0] - p[0]) * clamp(morph, 0, 1),
            p[1] + (targetRings[eye][i][1] - p[1]) * clamp(morph, 0, 1),
          ])
        );
      }

      function selectExpression(index) {
        currentRings = displayedRings();
        targetRings = EXPRESSIONS[index];
        expression = index;
        morph = 0;
        velocity = 0;
        document
          .querySelectorAll('.expression-grid button')
          .forEach((b, i) => b.setAttribute('aria-pressed', String(i === index)));
        $('status-expression').textContent = String(index).padStart(2, '0');
      }

      function blinkScale(now) {
        if (blinkStart === null) return 1;
        const t = (now - blinkStart) / 320;
        if (t >= 1) { blinkStart = null; return 1; }
        return Math.max(t < 0.42 ? 1 - t / 0.42 : (t - 0.42) / 0.58, 0.04);
      }

      function setAnimal(next) {
        animal = next;
        $('head-art').innerHTML =
          animal.ears.map((e, i) => `<g id="ear-${i}">${e.art}</g>`).join('') +
          `<path class="outline" d="${animal.head}"/>${animal.extras}` +
          `<g id="blush-g" class="blush" opacity="0">` +
          `<ellipse class="accent" rx="9" ry="4.5"/>` +
          `<ellipse class="accent" rx="9" ry="4.5"/>` +
          `</g>`;
        $('features').innerHTML =
          `<g id="nose-g">${animal.nose}</g><g id="mouth-g">${animal.mouth}</g>`;
        updateBlush();
        $('clip-path-el').setAttribute('d', animal.head);
        const s = animal.scale;
        $('face-map').setAttribute(
          'transform',
          `translate(120 ${animal.faceY}) scale(${s}) translate(${-CENTER} ${-CENTER})`
        );
        document
          .querySelectorAll('#animal-seg button')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === animal.id)));
      }

      function render(now) {
        const rings = displayedRings();
        const gazeX = 0;
        const gazeY = 0;
        const turn = (Number($('turn').value) * Math.PI) / 180;
        const blink = blinkScale(now);
        const s = animal.scale;
        const k = Math.min(1, 64 / Math.max(1, eyesHeight(rings) * s));
        $('face-map').setAttribute(
          'transform',
          `translate(120 ${animal.faceY}) scale(${(s * k).toFixed(4)}) translate(${-CENTER} ${-CENTER})`
        );
        const eyeInfo = [];
        rings.forEach((ring, index) => {
          const c = centroid(ring);
          const offset = c[0] - CENTER;
          const baseLongitude = Math.asin(clamp(offset / RADIUS, -1, 1));
          const longitude = baseLongitude + turn;
          const depth = Math.cos(longitude);
          const perspective = Math.max(depth, 0.02) / Math.max(Math.cos(baseLongitude), 0.02);
          const x = CENTER + RADIUS * Math.sin(longitude) + gazeX;
          const y = c[1] + gazeY;
          const sx = clamp(perspective, 0.02, 2.4);
          const sy = clamp(blink, 0.02, 2.4);
          const el = $('eye-' + index);
          el.setAttribute('d', pathFrom(ring));
          el.setAttribute(
            'transform',
            `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(${(-c[0]).toFixed(2)} ${(-c[1]).toFixed(2)})`
          );
          el.style.opacity = depth > 0.02 ? '1' : '0';
          let ringBot = -Infinity, ringTop = Infinity, ringL = Infinity, ringR = -Infinity;
          for (const p of ring) {
            ringBot = Math.max(ringBot, p[1]);
            ringTop = Math.min(ringTop, p[1]);
            ringL = Math.min(ringL, p[0]);
            ringR = Math.max(ringR, p[0]);
          }
          eyeInfo[index] = {
            ax: 120 + (x - CENTER) * s * k,
            abot: animal.faceY + (ringBot - CENTER) * s * k,
            ex: x,
            area: Math.max(1, (ringR - ringL) * (ringBot - ringTop)),
          };
        });
        const sinT = Math.sin(turn);
        const mean = meanCentroid(rings);
        const faceDx = mean[0] - EYE_HOME[0];
        const faceDy = mean[1] - EYE_HOME[1];
        const breath = Math.sin(now * 0.0016);
        const rigDx = sinT * 20 + faceDx * s * 0.5;
        const rigDy = faceDy * s * 0.5 + breath * 1.3;
        const tilt = faceDx * 0.12 + sinT * 3;
        const squeeze = 1 - 0.1 * (1 - Math.cos(turn));
        const stretch = clamp(velocity * 0.025, -0.09, 0.13);
        $('rig').setAttribute(
          'transform',
          `translate(${(120 + rigDx).toFixed(2)} ${(132 + rigDy).toFixed(2)}) ` +
            `rotate(${tilt.toFixed(2)}) ` +
            `scale(${(squeeze * (1 - stretch * 0.5)).toFixed(4)} ${(1 + stretch).toFixed(4)}) ` +
            `translate(-120 -132)`
        );
        const earWiggle = clamp(velocity, -3, 3) * 1.8 + faceDx * 0.08;
        animal.ears.forEach((e, i) => {
          const g = $('ear-' + i);
          if (!g) return;
          const st = earPhys[Math.min(i, earPhys.length - 1)];
          const sway = Math.sin(now * 0.0008 + i * 2.3) * 1.6;
          const angle = e.side * st.rot + earWiggle + sway;
          g.setAttribute(
            'transform',
            `translate(${e.pivot[0]} ${e.pivot[1]}) rotate(${angle.toFixed(2)}) ` +
              `scale(1 ${Math.max(0.5, st.sy).toFixed(3)}) translate(${-e.pivot[0]} ${-e.pivot[1]})`
          );
        });
        const openness = clamp(eyesHeight(rings) / EYES_BASE_HEIGHT, 0.25, 2.2);
        const bounce = clamp(Math.abs(velocity) * 0.05, 0, 0.3);
        const mouthSy = clamp((0.55 + 0.45 * openness) * (0.6 + 0.4 * blink) * (1 + bounce), 0.35, 1.35);
        const mouthSx = clamp(
          1 - (openness - 1) * 0.08 + bounce * 0.2 + Math.max(0, 0.7 - openness) * 0.3,
          0.85,
          1.25
        );
        const areaSum = eyeInfo[0].area + eyeInfo[1].area;
        const muzzleAx = (eyeInfo[0].ax * eyeInfo[0].area + eyeInfo[1].ax * eyeInfo[1].area) / areaSum;
        const MUZZLE_LEAD = 1.45;
        let muzzleDx = (muzzleAx - 120) * MUZZLE_LEAD + sinT * 36 * s;
        const eyesBotA = Math.max(eyeInfo[0].abot, eyeInfo[1].abot);
        const homeBotA = animal.faceY + (EYES_HOME_BOTTOM - CENTER) * s;
        let noseDy = clamp((eyesBotA - homeBotA) * 1.25, -40, 32);
        noseDy = Math.max(noseDy, eyesBotA + 4 - animal.noseTop);
        const faceR = RADIUS * s;
        const maxRad = faceR * 0.72;
        const rawRad = Math.hypot(muzzleDx, noseDy);
        if (rawRad > maxRad) {
          const f = maxRad / rawRad;
          muzzleDx *= f;
          noseDy *= f;
        }
        const radial = Math.min(1, Math.hypot(muzzleDx, noseDy * 0.8) / faceR);
        const sphereScale = clamp(1 - 0.45 * Math.pow(radial, 1.6), 0.55, 1);
        const sphereRot = -muzzleDx * 0.22;
        const px = 120;
        const py = (animal.noseTop + animal.mouthC[1]) / 2;
        const sphereT = (dy) =>
          `translate(${muzzleDx.toFixed(2)} ${dy.toFixed(2)}) ` +
          `translate(${px} ${py}) rotate(${sphereRot.toFixed(2)}) ` +
          `scale(${sphereScale.toFixed(3)}) translate(${-px} ${-py})`;
        $('nose-g').setAttribute('transform', sphereT(noseDy));
        const mc = animal.mouthC;
        const mouthDy = noseDy + Math.max(0, mouthSy - 1) * 5;
        $('mouth-g').setAttribute(
          'transform',
          sphereT(mouthDy) +
            ` translate(${mc[0]} ${mc[1]}) scale(${mouthSx.toFixed(3)} ${mouthSy.toFixed(3)}) ` +
            `translate(${-mc[0]} ${-mc[1]})`
        );
        document.querySelectorAll('#blush-g ellipse').forEach((el, i) => {
          const info = eyeInfo[i];
          if (!info) return;
          const out = Math.sign(info.ax - 120) || (i === 0 ? -1 : 1);
          el.setAttribute('cx', (info.ax + out * 9).toFixed(2));
          el.setAttribute('cy', Math.max(info.abot + 9, animal.faceY + 6).toFixed(2));
        });
        $('turn-output').textContent = $('turn').value + '°';
        $('spring-output').textContent = Number($('spring').value).toFixed(1);
      }

      function animate(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.1);
        lastFrame = now;
        const frequency = Number($('spring').value);
        velocity += (-2 * frequency * velocity - frequency * frequency * (morph - 1)) * dt;
        morph += velocity * dt;
        if (!Number.isFinite(morph)) { morph = 1; velocity = 0; }
        const pose = EAR_POSES[EAR_STATE[state] || 'neutral'];
        earPhys.forEach((e, i) => {
          let idx = Math.min(i, pose.length - 1);
          if (earSwap && pose.length > 1) idx = pose.length - 1 - idx;
          const target = pose[idx];
          const w0 = 14;
          const z = 0.5;
          e.vRot += (-2 * z * w0 * e.vRot - w0 * w0 * (e.rot - target.rot)) * dt;
          e.rot += e.vRot * dt;
          e.vSy += (-2 * z * w0 * e.vSy - w0 * w0 * (e.sy - target.sy)) * dt;
          e.sy += e.vSy * dt;
        });
        render(now);
        requestAnimationFrame(animate);
      }

      function scheduleBlink() {
        clearTimeout(autoBlinkTimer);
        const cadence = BLINK[state];
        if (!cadence) return;
        const delay = cadence[0] + Math.random() * (cadence[1] - cadence[0]);
        autoBlinkTimer = setTimeout(() => {
          blinkStart = performance.now();
          scheduleBlink();
        }, delay);
      }

      function scheduleExpression() {
        clearTimeout(autoExpressionTimer);
        const cadence = EXPR_CADENCE[state];
        const pool = POOLS[state];
        if (!cadence || !pool) return;
        const delay = cadence[0] + Math.random() * (cadence[1] - cadence[0]);
        autoExpressionTimer = setTimeout(() => {
          const alternatives = pool.filter((x) => x !== expression);
          const next = alternatives.length
            ? alternatives[Math.floor(Math.random() * alternatives.length)]
            : pool[0];
          selectExpression(next);
          scheduleExpression();
        }, delay);
      }

      function updateBlush() {
        const el = $('blush-g');
        if (el) el.style.opacity = HAPPY.has(state) ? '0.9' : '0';
      }

      function setState(next) {
        state = next;
        $('status-state').textContent = state + (PASSIVE.has(state) ? ' · calme' : ' · actif');
        selectExpression(POOLS[state][0]);
        scheduleExpression();
        scheduleBlink();
        scheduleEarTwitch();
        scheduleEarSwap();
        updateBlush();
        document
          .querySelectorAll('#state-groups button')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === state)));
      }

      const BOIL_SEEDS = [3, 9, 17];
      let boilIndex = 0;
      setInterval(() => {
        if (!$('boil').checked || PASSIVE.has(state)) return;
        boilIndex = (boilIndex + 1) % BOIL_SEEDS.length;
        $('boil-noise').setAttribute('seed', BOIL_SEEDS[boilIndex]);
      }, 140);

      $('blink-now').addEventListener('click', () => { blinkStart = performance.now(); });
      $('reset-all').addEventListener('click', () => {
        $('turn').value = 0;
        $('spring').value = 7;
        setState('waiting');
      });

      for (const a of ANIMALS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.id = a.id;
        b.textContent = a.name;
        b.addEventListener('click', () => setAnimal(a));
        $('animal-seg').appendChild(b);
      }
      EXPRESSIONS.forEach((_, index) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = String(index).padStart(2, '0');
        b.addEventListener('click', () => {
          selectExpression(index);
          scheduleExpression();
        });
        $('expression-grid').appendChild(b);
      });
      Object.entries(GROUPS).forEach(([label, states]) => {
        const wrap = document.createElement('div');
        wrap.className = 'state-group';
        const title = document.createElement('span');
        title.textContent = label;
        wrap.appendChild(title);
        const seg = document.createElement('div');
        seg.className = 'seg';
        for (const name of states) {
          const b = document.createElement('button');
          b.type = 'button';
          b.dataset.state = name;
          b.textContent = name;
          b.addEventListener('click', () => setState(name));
          seg.appendChild(b);
        }
        wrap.appendChild(seg);
        $('state-groups').appendChild(wrap);
      });

      const params = new URLSearchParams(location.search);
      setAnimal(ANIMALS.find((a) => a.id === params.get('animal')) || ANIMALS[0]);
      setState(POOLS[params.get('state')] ? params.get('state') : 'waiting');
      if (params.get('turn') !== null) $('turn').value = clamp(Number(params.get('turn')) || 0, -100, 100);
      if (params.get('expr') !== null) {
        clearTimeout(autoExpressionTimer);
        selectExpression(clamp(Number(params.get('expr')) || 0, 0, EXPRESSIONS.length - 1));
        morph = 1;
      }
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
