<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Proto B — formes rondes</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500&display=swap');
      :root {
        --page: #f1efe8;
        --background: #fffdf7;
        --foreground: #171813;
        --muted-foreground: #6e7067;
        --border: #d5d1c5;
        --primary: #2f66e8;
        --orange: #e36f3d;
        --ink: #26241f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #11130f;
          --background: #1c1f19;
          --foreground: #f3f0e7;
          --muted-foreground: #a5a89d;
          --border: #393d33;
          --primary: #6f96ff;
          --orange: #ff8b5e;
          --ink: #e8e4d8;
        }
      }
      html {
        background: var(--page);
        color-scheme: light dark;
      }
      body {
        margin: 0 auto;
        padding: 36px 24px 80px;
        font-family: 'Azeret Mono', monospace;
        color: var(--foreground);
        max-width: 1080px;
      }
      h1 {
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: 32px;
        margin: 0 0 6px;
      }
      .kicker {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .shell {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 24px;
        align-items: start;
        margin-top: 24px;
      }
      @media (max-width: 820px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }
      .preview {
        position: sticky;
        top: 24px;
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .preview svg {
        width: 100%;
        height: auto;
        touch-action: none;
      }
      .status-line {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .status-line strong {
        color: var(--foreground);
        font-weight: 500;
      }
      .panel {
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .panel h3 {
        margin: 0 0 10px;
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: 17px;
      }
      .seg {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .seg button,
      .action {
        font: inherit;
        font-size: 12px;
        padding: 7px 13px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--foreground);
        cursor: pointer;
      }
      .seg button[aria-pressed='true'] {
        border-color: var(--primary);
        color: var(--primary);
        box-shadow: inset 0 0 0 1px var(--primary);
      }
      .action.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .expression-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
        gap: 6px;
      }
      .expression-grid button {
        font: inherit;
        font-size: 11px;
        padding: 6px 0;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--foreground);
        cursor: pointer;
      }
      .expression-grid button[aria-pressed='true'] {
        border-color: var(--primary);
        color: var(--primary);
      }
      .state-groups {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .state-group span {
        display: block;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        margin-bottom: 6px;
      }
      .control {
        display: block;
        margin-top: 12px;
        font-size: 12px;
      }
      .control-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--primary);
      }
      .switch-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        margin-top: 10px;
      }
      .button-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .outline {
        stroke: var(--stroke-c, var(--ink));
        fill: var(--background);
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line {
        stroke: var(--stroke-c, var(--ink));
        fill: none;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .accent {
        fill: var(--orange);
        stroke: none;
      }
      .eye {
        fill: var(--eye-c, var(--ink));
      }
      .blush {
        transition: opacity 0.5s ease;
      }
      .swatch-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .swatch-row > span {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        width: 84px;
        flex-shrink: 0;
      }
      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--border);
        cursor: pointer;
        padding: 0;
      }
      .swatch[aria-pressed='true'] {
        box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--primary);
      }
      .spark {
        pointer-events: none;
        fill: var(--background);
      }
      .nav {
        font-size: 12px;
        margin: 6px 0 0;
      }
      .nav a {
        color: var(--primary);
        text-decoration: none;
      }
      .nav span {
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <span class="kicker">Prototype · esquisse × moteur d'animation</span>
    <h1>Proto B — formes rondes</h1>
    <p class="nav"><a href="fusion.html">Proto A — esquisse</a> · <span>Proto B — rond</span> · <a href="fusion-c.html">Proto C — kawaii</a></p>

    <div class="shell">
      <aside class="preview">
        <svg id="stage" viewBox="0 0 240 240">
          <defs>
            <filter id="sketch" x="-15%" y="-15%" width="130%" height="130%">
              <feTurbulence id="boil-noise" type="fractalNoise" baseFrequency="0.024" numOctaves="3" seed="3" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
            </filter>
            <clipPath id="face-clip"><path id="clip-path-el" d=""/></clipPath>
          </defs>
          <g filter="url(#sketch)">
            <g id="rig">
              <g id="head-art"></g>
              <g clip-path="url(#face-clip)">
                <g id="face-map">
                  <path class="eye" id="eye-0"/>
                  <path class="eye" id="eye-1"/>
                  <circle class="spark" id="spark-0" r="7"/>
                  <circle class="spark" id="spark-1" r="7"/>
                </g>
              </g>
              <g id="features"></g>
            </g>
          </g>
        </svg>
        <div class="status-line">
          <span>État <strong id="status-state">waiting</strong></span>
          <span>Expression <strong id="status-expression">00</strong></span>
        </div>
        <div class="button-row">
          <button class="action primary" id="blink-now" type="button">Cligner</button>
          <button class="action" id="reset-all" type="button">Réinitialiser</button>
        </div>
      </aside>

      <main>
        <div class="panel">
          <h3>Animal</h3>
          <div class="seg" id="animal-seg"></div>
        </div>

        <div class="panel">
          <h3>Couleur</h3>
          <div class="swatch-row"><span>Bordures</span><div class="seg" id="stroke-swatches"></div></div>
          <div class="swatch-row"><span>Yeux</span><div class="seg" id="eye-swatches"></div></div>
        </div>

        <div class="panel">
          <h3>État</h3>
          <div class="state-groups" id="state-groups"></div>
        </div>

        <div class="panel">
          <h3>Expression manuelle</h3>
          <div class="expression-grid" id="expression-grid"></div>
        </div>

        <div class="panel">
          <h3>Réglages</h3>
          <label class="control">
            <span class="control-head"><span>Rotation</span><output id="turn-output">0°</output></span>
            <input id="turn" type="range" min="-100" max="100" value="0" step="1" />
          </label>
          <label class="control">
            <span class="control-head"><span>Vitesse du ressort</span><output id="spring-output">7.0</output></span>
            <input id="spring" type="range" min="4" max="12" value="7" step=".5" />
          </label>
          <div class="switch-line">
            <label for="boil">Trait vivant (états actifs seulement)</label>
            <input id="boil" type="checkbox" checked />
          </div>
        </div>
      </main>
    </div>

    <script src="engine-data.js"></script>
    <script>
      const { EXPRESSIONS, GROUPS, POOLS, EXPR_CADENCE, BLINK } = window.GROKBOT_DATA;
      const $ = (id) => document.getElementById(id);

      const CENTER = 114.2705;
      const makeUwuExpression = () => {
        const width = 42;
        const depth = 15;
        const thick = 9;
        const cy = 96;
        const makeEye = (cx) => {
          const ring = [];
          for (let i = 0; i < 24; i++) {
            const t = i / 23;
            ring.push([cx - width / 2 + width * t, cy + depth * Math.sin(Math.PI * t)]);
          }
          for (let i = 0; i < 24; i++) {
            const t = 1 - i / 23;
            ring.push([cx - width / 2 + width * t, cy + depth * Math.sin(Math.PI * t) - thick]);
          }
          return ring;
        };
        return [makeEye(CENTER - 38), makeEye(CENTER + 38)];
      };
      EXPRESSIONS.push(makeUwuExpression());
      const UWU = EXPRESSIONS.length - 1;

      GROUPS['Cycle de vie'] = ['waiting', ...GROUPS['Cycle de vie']];
      POOLS.waiting = [UWU];
      EXPR_CADENCE.waiting = [9000, 16000];
      BLINK.waiting = null;
      const PASSIVE = new Set(['waiting', 'sleeping', 'idle', 'bored', 'drowsy', 'powering-down']);
      const HAPPY = new Set(['waiting', 'happy', 'laughing', 'playful', 'celebrate', 'excited', 'proud']);

      const ANIMALS = [
        {
          id: 'cat',
          name: 'Chat',
          faceY: 126,
          scale: 0.45,
          head: `
            M76,84 C68,64 72,46 84,40 C94,36 104,44 108,52
            C114,48 126,48 132,52 C136,44 146,36 156,40
            C168,46 172,64 164,84 C178,98 186,116 186,138
            C186,178 158,204 120,204 C82,204 54,178 54,138
            C54,116 62,98 76,84 Z`,
          extras: `
            <path class="accent" d="M85,60 L91,46 L102,57 Z"/>
            <path class="accent" d="M155,60 L149,46 L138,57 Z"/>`,
          nose: `<path class="accent" d="M114,148 h12 l-6,8 Z"/>`,
          mouth: `<path class="line" d="M104,162 q16,11 32,0"/>`,
          mouthC: [120, 167],
          noseTop: 148,
        },
        {
          id: 'fox',
          name: 'Renard',
          faceY: 124,
          scale: 0.45,
          head: `
            M70,88 C58,64 58,38 68,28 C82,32 94,44 102,50
            C114,46 126,46 138,50 C146,44 158,32 172,28
            C182,38 182,64 170,88 C182,102 188,120 188,140
            C188,176 158,198 120,198 C82,198 52,176 52,140
            C52,120 58,102 70,88 Z`,
          extras: `
            <path class="accent" d="M72,70 L68,42 L94,58 Z"/>
            <path class="accent" d="M168,70 L172,42 L146,58 Z"/>`,
          nose: `<path class="accent" d="M114,148 h12 l-6,8 Z"/>`,
          mouth: `<path class="line" d="M106,162 q14,10 28,0"/>`,
          mouthC: [120, 167],
          noseTop: 148,
        },
        {
          id: 'rabbit',
          name: 'Lapin',
          faceY: 142,
          scale: 0.4,
          head: `
            M96,92 C86,74 84,48 92,34 C102,40 108,64 108,86
            C112,82 128,82 132,86 C132,64 138,40 148,34
            C156,48 154,74 144,92 C162,102 174,120 174,142
            C174,178 150,202 120,202 C90,202 66,178 66,142
            C66,120 78,102 96,92 Z`,
          extras: `
            <path class="accent" d="M96,78 C91,64 90,50 94,42 C100,50 102,66 102,78 Z"/>
            <path class="accent" d="M144,78 C149,64 150,50 146,42 C140,50 138,66 138,78 Z"/>`,
          nose: `<path class="accent" d="M115,158 h10 l-5,7 Z"/>`,
          mouth: `<path class="line" d="M108,172 q12,9 24,0"/>`,
          mouthC: [120, 176],
          noseTop: 158,
        },
        {
          id: 'bear',
          name: 'Ours',
          faceY: 126,
          scale: 0.45,
          head: `
            M80,78 C66,72 62,54 74,46 C82,40 94,44 100,52
            C112,46 128,46 140,52 C146,44 158,40 166,46
            C178,54 174,72 160,78 C176,92 184,112 184,136
            C184,174 156,198 120,198 C84,198 56,174 56,136
            C56,112 64,92 80,78 Z`,
          extras: `
            <circle class="accent" cx="84" cy="58" r="7"/>
            <circle class="accent" cx="156" cy="58" r="7"/>`,
          nose: `<path class="accent" d="M113,150 h14 l-7,9 Z"/>`,
          mouth: `<path class="line" d="M106,164 q14,10 28,0"/>`,
          mouthC: [120, 169],
          noseTop: 150,
        },
        {
          id: 'chick',
          name: 'Poussin',
          faceY: 124,
          scale: 0.42,
          head: `
            M104,58 C108,50 114,46 116,38 C120,46 120,52 118,56
            C124,50 132,48 138,50 C134,56 128,62 124,64
            C152,70 174,96 174,132 C174,168 150,194 120,194
            C90,194 66,168 66,132 C66,96 82,64 104,58 Z`,
          extras: ``,
          nose: `<path class="accent" d="M112,146 L120,141 L128,146 L120,153 Z"/>`,
          mouth: ``,
          mouthC: [120, 150],
          noseTop: 141,
        },
        {
          id: 'dog',
          name: 'Chien',
          faceY: 120,
          scale: 0.42,
          head: `
            M78,74 C64,80 56,96 54,116 C52,136 58,152 68,158
            C72,154 76,148 78,140 C86,170 102,184 120,184
            C138,184 154,170 162,140 C164,148 168,154 172,158
            C182,152 188,136 186,116 C184,96 176,80 162,74
            C150,60 90,60 78,74 Z`,
          extras: `
            <path class="accent" d="M66,98 C58,110 56,128 62,142 C70,136 74,122 74,108 Z"/>
            <path class="accent" d="M174,98 C182,110 184,128 178,142 C170,136 166,122 166,108 Z"/>`,
          nose: `<path class="accent" d="M113,150 h14 l-7,9 Z"/>`,
          mouth: `<path class="line" d="M120,159 v5 M106,170 q14,10 28,0"/>`,
          mouthC: [120, 170],
          noseTop: 150,
        },
      ];

      const RADIUS = 105;
      const meanCentroid = (rings) => {
        let x = 0, y = 0, n = 0;
        for (const ring of rings) {
          for (const p of ring) { x += p[0]; y += p[1]; n++; }
        }
        return [x / n, y / n];
      };
      const EYE_HOME = (() => {
        let x = 0, y = 0;
        for (const rings of EXPRESSIONS) {
          const m = meanCentroid(rings);
          x += m[0];
          y += m[1];
        }
        return [x / EXPRESSIONS.length, y / EXPRESSIONS.length];
      })();
      const ringHeight = (ring) => {
        let min = Infinity, max = -Infinity;
        for (const p of ring) {
          min = Math.min(min, p[1]);
          max = Math.max(max, p[1]);
        }
        return max - min;
      };
      const eyesHeight = (rings) => (ringHeight(rings[0]) + ringHeight(rings[1])) / 2;
      const EYES_BASE_HEIGHT = eyesHeight(EXPRESSIONS[0]);
      const eyesBottom = (rings) => {
        let max = -Infinity;
        for (const ring of rings) for (const p of ring) max = Math.max(max, p[1]);
        return max;
      };
      const EYES_HOME_BOTTOM =
        EXPRESSIONS.reduce((sum, rings) => sum + eyesBottom(rings), 0) / EXPRESSIONS.length;

      let animal = ANIMALS[0];
      let expression = 0;
      let currentRings = EXPRESSIONS[0].map((r) => r.map((p) => [p[0], p[1]]));
      let targetRings = EXPRESSIONS[0];
      let morph = 1;
      let velocity = 0;
      let lastFrame = performance.now();
      let blinkStart = null;
      let state = 'idle';
      let autoExpressionTimer = null;
      let autoBlinkTimer = null;

      const centroid = (ring) => {
        let x = 0, y = 0;
        ring.forEach((p) => { x += p[0]; y += p[1]; });
        return [x / ring.length, y / ring.length];
      };
      const pathFrom = (ring) =>
        'M' + ring.map((p) => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') + 'Z';
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      function displayedRings() {
        return currentRings.map((ring, eye) =>
          ring.map((p, i) => [
            p[0] + (targetRings[eye][i][0] - p[0]) * clamp(morph, 0, 1),
            p[1] + (targetRings[eye][i][1] - p[1]) * clamp(morph, 0, 1),
          ])
        );
      }

      function selectExpression(index) {
        currentRings = displayedRings();
        targetRings = EXPRESSIONS[index];
        expression = index;
        morph = 0;
        velocity = 0;
        document
          .querySelectorAll('.expression-grid button')
          .forEach((b, i) => b.setAttribute('aria-pressed', String(i === index)));
        $('status-expression').textContent = String(index).padStart(2, '0');
      }

      function blinkScale(now) {
        if (blinkStart === null) return 1;
        const t = (now - blinkStart) / 320;
        if (t >= 1) { blinkStart = null; return 1; }
        return Math.max(t < 0.42 ? 1 - t / 0.42 : (t - 0.42) / 0.58, 0.04);
      }

      function setAnimal(next) {
        animal = next;
        $('head-art').innerHTML =
          `<path class="outline" d="${animal.head}"/>${animal.extras}` +
          `<g id="blush-g" class="blush" opacity="0">` +
          `<ellipse class="accent" cx="${120 - 36}" cy="${animal.faceY + 18}" rx="9" ry="4.5"/>` +
          `<ellipse class="accent" cx="${120 + 36}" cy="${animal.faceY + 18}" rx="9" ry="4.5"/>` +
          `</g>`;
        $('features').innerHTML =
          `<g id="nose-g">${animal.nose}</g><g id="mouth-g">${animal.mouth}</g>`;
        updateBlush();
        $('clip-path-el').setAttribute('d', animal.head);
        const s = animal.scale;
        $('face-map').setAttribute(
          'transform',
          `translate(120 ${animal.faceY}) scale(${s}) translate(${-CENTER} ${-CENTER})`
        );
        document
          .querySelectorAll('#animal-seg button')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === animal.id)));
      }

      function render(now) {
        const rings = displayedRings();
        const gazeX = 0;
        const gazeY = 0;
        const turn = (Number($('turn').value) * Math.PI) / 180;
        const blink = blinkScale(now);
        const openRatio = eyesHeight(rings) / EYES_BASE_HEIGHT;
        rings.forEach((ring, index) => {
          const c = centroid(ring);
          const offset = c[0] - CENTER;
          const baseLongitude = Math.asin(clamp(offset / RADIUS, -1, 1));
          const longitude = baseLongitude + turn;
          const depth = Math.cos(longitude);
          const perspective = Math.max(depth, 0.02) / Math.max(Math.cos(baseLongitude), 0.02);
          const x = CENTER + RADIUS * Math.sin(longitude) + gazeX;
          const y = c[1] + gazeY;
          const sx = clamp(perspective, 0.02, 2.4);
          const sy = clamp(blink, 0.02, 2.4);
          const el = $('eye-' + index);
          el.setAttribute('d', pathFrom(ring));
          el.setAttribute(
            'transform',
            `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(${(-c[0]).toFixed(2)} ${(-c[1]).toFixed(2)})`
          );
          el.style.opacity = depth > 0.02 ? '1' : '0';
          const sp = $('spark-' + index);
          sp.setAttribute('cx', (x - 6).toFixed(2));
          sp.setAttribute('cy', (y - 8).toFixed(2));
          sp.style.opacity = depth > 0.02 && blink > 0.5 && openRatio > 0.5 ? '1' : '0';
        });
        const s = animal.scale;
        const sinT = Math.sin(turn);
        const mean = meanCentroid(rings);
        const faceDx = mean[0] - EYE_HOME[0];
        const faceDy = mean[1] - EYE_HOME[1];
        const breath = Math.sin(now * 0.0016);
        const rigDx = sinT * 20 + faceDx * s * 0.5;
        const rigDy = faceDy * s * 0.5 + breath * 1.3;
        const tilt = faceDx * 0.12 + sinT * 3;
        const squeeze = 1 - 0.1 * (1 - Math.cos(turn));
        const stretch = clamp(velocity * 0.025, -0.09, 0.13);
        $('rig').setAttribute(
          'transform',
          `translate(${(120 + rigDx).toFixed(2)} ${(132 + rigDy).toFixed(2)}) ` +
            `rotate(${tilt.toFixed(2)}) ` +
            `scale(${(squeeze * (1 - stretch * 0.5)).toFixed(4)} ${(1 + stretch).toFixed(4)}) ` +
            `translate(-120 -132)`
        );
        const openness = clamp(eyesHeight(rings) / EYES_BASE_HEIGHT, 0.25, 2.2);
        const bounce = clamp(Math.abs(velocity) * 0.05, 0, 0.3);
        const mouthSy = clamp((0.55 + 0.45 * openness) * (0.6 + 0.4 * blink) * (1 + bounce), 0.35, 1.35);
        const mouthSx = clamp(
          1 - (openness - 1) * 0.08 + bounce * 0.2 + Math.max(0, 0.7 - openness) * 0.3,
          0.85,
          1.25
        );
        const k = Math.min(1, 54 / Math.max(1, eyesHeight(rings) * s));
        $('face-map').setAttribute(
          'transform',
          `translate(120 ${animal.faceY}) scale(${(s * k).toFixed(4)}) translate(${-CENTER} ${-CENTER})`
        );
        const featDy = faceDy * 0.3 + (eyesBottom(rings) - EYES_HOME_BOTTOM) * 0.45;
        const eyesBotA = animal.faceY + (eyesBottom(rings) - CENTER) * s * k;
        let noseDy = featDy * s;
        noseDy = Math.max(noseDy, eyesBotA + 5 - animal.noseTop);
        $('nose-g').setAttribute(
          'transform',
          `translate(${(sinT * 26 * s + faceDx * s * 0.85).toFixed(2)} ${noseDy.toFixed(2)})`
        );
        const mc = animal.mouthC;
        $('mouth-g').setAttribute(
          'transform',
          `translate(${(sinT * 40 * s + faceDx * s * 0.9).toFixed(2)} ${(noseDy * 1.08).toFixed(2)}) ` +
            `translate(${mc[0]} ${mc[1]}) scale(${mouthSx.toFixed(3)} ${mouthSy.toFixed(3)}) ` +
            `translate(${-mc[0]} ${-mc[1]})`
        );
        $('turn-output').textContent = $('turn').value + '°';
        $('spring-output').textContent = Number($('spring').value).toFixed(1);
      }

      function animate(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.1);
        lastFrame = now;
        const frequency = Number($('spring').value);
        velocity += (-2 * frequency * velocity - frequency * frequency * (morph - 1)) * dt;
        morph += velocity * dt;
        if (!Number.isFinite(morph)) { morph = 1; velocity = 0; }
        render(now);
        requestAnimationFrame(animate);
      }

      function scheduleBlink() {
        clearTimeout(autoBlinkTimer);
        const cadence = BLINK[state];
        if (!cadence) return;
        const delay = cadence[0] + Math.random() * (cadence[1] - cadence[0]);
        autoBlinkTimer = setTimeout(() => {
          blinkStart = performance.now();
          scheduleBlink();
        }, delay);
      }

      function scheduleExpression() {
        clearTimeout(autoExpressionTimer);
        const cadence = EXPR_CADENCE[state];
        const pool = POOLS[state];
        if (!cadence || !pool) return;
        const delay = cadence[0] + Math.random() * (cadence[1] - cadence[0]);
        autoExpressionTimer = setTimeout(() => {
          const alternatives = pool.filter((x) => x !== expression);
          const next = alternatives.length
            ? alternatives[Math.floor(Math.random() * alternatives.length)]
            : pool[0];
          selectExpression(next);
          scheduleExpression();
        }, delay);
      }

      function updateBlush() {
        const el = $('blush-g');
        if (el) el.style.opacity = HAPPY.has(state) ? '0.9' : '0';
      }

      function setState(next) {
        state = next;
        $('status-state').textContent = state + (PASSIVE.has(state) ? ' · calme' : ' · actif');
        selectExpression(POOLS[state][0]);
        scheduleExpression();
        scheduleBlink();
        updateBlush();
        document
          .querySelectorAll('#state-groups button')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === state)));
      }

      const BOIL_SEEDS = [3, 9, 17];
      let boilIndex = 0;
      setInterval(() => {
        if (!$('boil').checked || PASSIVE.has(state)) return;
        boilIndex = (boilIndex + 1) % BOIL_SEEDS.length;
        $('boil-noise').setAttribute('seed', BOIL_SEEDS[boilIndex]);
      }, 140);

      $('blink-now').addEventListener('click', () => { blinkStart = performance.now(); });
      $('reset-all').addEventListener('click', () => {
        $('turn').value = 0;
        $('spring').value = 7;
        setState('waiting');
      });

      for (const a of ANIMALS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.id = a.id;
        b.textContent = a.name;
        b.addEventListener('click', () => setAnimal(a));
        $('animal-seg').appendChild(b);
      }
      EXPRESSIONS.forEach((_, index) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = String(index).padStart(2, '0');
        b.addEventListener('click', () => {
          selectExpression(index);
          scheduleExpression();
        });
        $('expression-grid').appendChild(b);
      });
      Object.entries(GROUPS).forEach(([label, states]) => {
        const wrap = document.createElement('div');
        wrap.className = 'state-group';
        const title = document.createElement('span');
        title.textContent = label;
        wrap.appendChild(title);
        const seg = document.createElement('div');
        seg.className = 'seg';
        for (const name of states) {
          const b = document.createElement('button');
          b.type = 'button';
          b.dataset.state = name;
          b.textContent = name;
          b.addEventListener('click', () => setState(name));
          seg.appendChild(b);
        }
        wrap.appendChild(seg);
        $('state-groups').appendChild(wrap);
      });

      const COLORS = ['', '#2f66e8', '#7c5cff', '#2f9e6e', '#e0558f', '#e36f3d', '#e8b93d'];
      const stageEl = $('stage');
      function buildSwatches(elId, cssVar) {
        const el = $(elId);
        for (const color of COLORS) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'swatch';
          b.title = color || 'défaut';
          b.style.background = color || 'var(--ink)';
          b.setAttribute('aria-pressed', String(color === ''));
          b.addEventListener('click', () => {
            if (color) stageEl.style.setProperty(cssVar, color);
            else stageEl.style.removeProperty(cssVar);
            el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
            b.setAttribute('aria-pressed', 'true');
          });
          el.appendChild(b);
        }
      }
      buildSwatches('stroke-swatches', '--stroke-c');
      buildSwatches('eye-swatches', '--eye-c');

      const params = new URLSearchParams(location.search);
      setAnimal(ANIMALS.find((a) => a.id === params.get('animal')) || ANIMALS[0]);
      setState(POOLS[params.get('state')] ? params.get('state') : 'waiting');
      if (params.get('turn') !== null) $('turn').value = clamp(Number(params.get('turn')) || 0, -100, 100);
      if (params.get('stroke')) stageEl.style.setProperty('--stroke-c', '#' + params.get('stroke'));
      if (params.get('eyes')) stageEl.style.setProperty('--eye-c', '#' + params.get('eyes'));
      if (params.get('expr') !== null) {
        clearTimeout(autoExpressionTimer);
        selectExpression(clamp(Number(params.get('expr')) || 0, 0, EXPRESSIONS.length - 1));
        morph = 1;
      }
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
