[package]
name = "opennest-app"
version = "0.12.2"
description = "OpenNest desktop app"
edition = "2021"
license = "MIT"
repository = "https://github.com/shoto290/OpenNest"
default-run = "OpenNest"

[lib]
name = "opennest_app"
path = "src/lib.rs"

[[bin]]
name = "OpenNest"
path = "src/main.rs"

# Every suite but real_claude.rs spawns this, so run them with
# `cargo test --features fake-claude`. Cargo hands the tests its path either
# way, so a plain `cargo test` still compiles and then fails at each spawn with
# `SpawnFailed { detail: "No such file or directory" }`.
#
# `fake_sidecar` stands in for the one process every session is served from, and
# for the install the connection probe and the model catalogue ask about.
[[bin]]
name = "fake_sidecar"
path = "src/bin/fake_sidecar.rs"
required-features = ["fake-claude"]

[features]
fake-claude = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "io-util", "sync", "time", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Every bundle is its own repository and no machine is asked for a `git` binary:
# libgit2 is compiled in, and no transport is — nothing here ever leaves the disk.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# The one cron library that enumerates the occurrence before a given instant, which the
# catch-up of the occurrences missed while the app was closed reads.
croner = "4"
# Watches paths from the core rather than through `tauri-plugin-fs`, whose watch command only
# answers a window: a routine fires whether or not one listens. Shows `notify` through.
notify-debouncer-full = "0.6"
# Already in the tree under croner; named here so an instant in milliseconds becomes the wall
# clock a cron expression is read against, and the moment a payload carries.
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The route that answers what became of a notification when the executable runs outside a
# .app bundle, where `UNUserNotificationCenter` has no bundle identifier to work from.
# Already in the tree under `notify-rust`, which `tauri-plugin-notification` shows through.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
# The route a signed .app bundle shows through: `UNUserNotificationCenter` is the only one
# macOS reports a click back from once the app is installed. MIT OR Apache-2.0.
mac-usernotifications = "0.3"
# Already in the tree under `tao`; named here so the window controls are placed
# from their measured frames at runtime rather than from a literal in the config.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
	"std",
	"NSButton",
	"NSControl",
	"NSResponder",
	"NSView",
	"NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
	"std",
	"NSGeometry",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Already a dependency; named again so an integration test can build the pictures it
# uploads and decode the ones the host stored, rather than checking bytes in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1", features = ["macros", "process", "io-util", "sync", "time", "rt-multi-thread"] }
libc = "0.2"
