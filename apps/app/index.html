<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opennest</title>
    <!--
      The palette on the first frame the webview paints, which is two things React
      mounts too late to own. The stylesheet is linked on the document rather than
      only imported from `main.tsx`, where it would reach the page as a tag injected
      after that frame, so it blocks the frame instead. The scheme and the palette are
      read off the mirror `src/lib/user/theme-mirror.ts` writes, here rather than
      through it because a module import cannot block that frame either.
    -->
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      (() => {
        const root = document.documentElement
        const scheme = localStorage.getItem("theme")
        const isDark =
          scheme === "dark" ||
          (scheme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)

        root.classList.add(isDark ? "dark" : "light")
        root.dataset.theme = localStorage.getItem("palette") ?? "amber"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
